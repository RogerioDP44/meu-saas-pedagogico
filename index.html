<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sismatic - Inteligência Pedagógica BNCC</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎒</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes pulsarBrilho {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(75, 43, 162, 0.7); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(75, 43, 162, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(75, 43, 162, 0); }
        }
        .btn-destaque { animation: pulsarBrilho 2s infinite; background: linear-gradient(135deg, var(--secondary), #6d28d9) !important; }
        :root { --primary: #7c3aed; --secondary: #4b2ba2; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 25px; }
        .badge-status { background: #ede9fe; color: var(--primary); padding: 6px 14px; border-radius: 50px; font-weight: bold; font-size: 12px; }
        input, textarea { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 14px; font-size: 16px; box-sizing: border-box; background: #fafafa; margin-bottom: 15px; }
        .btn-ia { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 20px; width: 100%; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .acoes-rapidas { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .btn-acao { border: none; padding: 12px; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; }
        .btn-save { background: #3b82f6; grid-column: span 2; }
        .btn-print { background: #64748b; }
        .btn-clear { background: #94a3b8; }
        .historico-section { margin-top: 30px; border-top: 2px dashed #eee; padding-top: 20px; }
        .historico-item { background: #f8fafc; border-left: 5px solid var(--primary); padding: 12px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .historico-item:hover { background: #f1f5f9; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
    <div>
        <h2 style="margin:0; color:var(--primary);">🎒 Sismatic</h2>
        <a href="como-usar.html" style="text-decoration:none; color:#7c3aed; font-size:12px; font-weight:bold;">❓ Como Usar</a>
    </div>
    <div style="text-align:right;">
        <span id="userLogado" style="font-size:13px; font-weight:bold;">...</span><br>
        <div class="badge-status">Status: <span id="numCreditos">...</span></div><br>
        <a href="login.html" id="btnEntrar" style="display:none; color:#25D366; font-size:12px; font-weight:bold; text-decoration:none;">🟢 Entrar / Cadastrar</a>
        <a href="#" id="btnSair" onclick="fazerLogout(event)" style="display:none; color:#ef4444; font-size:12px; font-weight:bold; text-decoration:none;">🔴 Sair</a>
    </div>
</div>

    <div id="containerDica" style="display:none; background:#fff9db; padding:15px; border-radius:10px; margin-bottom:10px; border-left:5px solid #fcc419;">
        <small style="color:#856404; font-weight:bold;">💡 Dica Pedagógica:</small>
        <p id="textoDica" style="margin:5px 0 0 0; font-size:14px; color:#856404;"></p>
    </div>

    <label>O que vamos planejar hoje?</label>
    <input type="text" id="inputTema" placeholder="Ex: Higiene Bucal - Educação Infantil">
    <button id="btnIA" onclick="gerarComIA()" class="btn-ia">✨ Gerar Planejamento</button>

    <div style="margin-top:20px;">
        <label>Plano Gerado:</label>
        <textarea id="inputConteudo" rows="12" placeholder="O plano aparecerá aqui..."></textarea>
    </div>

    <div class="acoes-rapidas">
        <button onclick="salvarNoBanco()" class="btn-acao btn-save">💾 Salvar no Histórico (30 dias)</button>
        <button onclick="zapDireto()" class="btn-acao btn-zap" style="background:#25D366;">🟢 WhatsApp</button>
        <button onclick="pdfDireto()" class="btn-acao btn-pdf" style="background:#e11d48;">🔴 Baixar PDF</button>
        <button onclick="imprimirDireto()" class="btn-acao btn-print" style="background:#64748b;">🖨️ Imprimir</button>
        <button onclick="limparTela()" class="btn-acao btn-clear">🧹 Limpar</button>
    </div>

    <div class="historico-section">
        <h3>📂 Seus Planejamentos Salvos</h3>
        <div id="listaAtividades"></div>
    </div>

    <div id="sessaoPlanos" class="sessao-vendas" style="margin-top: 30px; background: #fdfcff; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid #ede9fe;">
        <h3 style="color: var(--primary); margin-bottom: 5px; font-size: 18px;">🚀 Evolua para o Sismatic PRO</h3>
        <p style="font-size: 13px; color: #666; margin-bottom: 25px;">Planos ilimitados e salvamento dos planejamentos.</p>
        <div class="grid-precos" style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
            <div class="card-preco" style="background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 200px; border: 1px solid #eee;">
                <h4 style="margin: 0; font-size: 15px;">Mensal</h4>
                <p style="font-size: 22px; font-weight: bold; color: var(--secondary); margin: 12px 0;">R$ 19,90</p>
                <button onclick="iniciarPagamento('mensal')" class="btn-assinar" style="background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s;">Assinar Mensal</button>
            </div>
            <div class="card-preco" style="background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 200px; border: 2px solid var(--primary);">
                <h4 style="margin: 0; font-size: 15px;">Anual</h4>
                <p style="font-size: 22px; font-weight: bold; color: var(--secondary); margin: 12px 0;">R$ 149,00</p>
                <button onclick="iniciarPagamento('anual')" class="btn-assinar btn-destaque" style="color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px;">Assinar Anual (Melhor Oferta! ✨)</button>
            </div>
        </div>
    </div>
</div>

<a href="https://api.whatsapp.com/send?phone=5517997812145&text=Olá, preciso de ajuda com o Sismatic!" 
   target="_blank" 
   style="position:fixed; bottom:20px; right:20px; background:#25D366; color:white; width:60px; height:60px; border-radius:50px; text-align:center; font-size:30px; box-shadow: 2px 2px 10px rgba(0,0,0,0.2); z-index:1000; line-height:60px; text-decoration:none;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" style="width:35px; margin-top:12px;">
</a>

<script src="script.js"></script>
</body>
</html>
